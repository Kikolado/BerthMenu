# (The copy GitHub uses is .github/workflows/release.yml; setup-github.ps1 and
# release.ps1 copy it there from ci/release.yml.)
#
# Builds the BerthMenu installer on GitHub's own Windows machines and publishes
# it as a GitHub release — so a release doesn't need your PC at all.
#
# Runs when a version tag like v0.9.0 is pushed (release.ps1 does that for you).
# Can also be started by hand from the repository's Actions tab ("Run workflow"):
# that builds the installer as a downloadable test file without making a release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/BerthMenu/BerthMenu.csproj
          $version = $proj.SelectSingleNode('//Version').InnerText
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) { throw "Tag v$tag doesn't match <Version>$version</Version> in BerthMenu.csproj." }

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Fingerprint the installer (SHA-256)
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/Output/BerthMenu-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "$($exe.FullName).sha256"
          "INSTALLER=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Keep the installer as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: BerthMenu-installer
          path: installer/Output/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md (the same list
          # BerthMenu shows in its "What's new" window), or GitHub's own list of
          # commits if the changelog has no section for it.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            if ($line -match '^##\s+(\S+)') {
              if ($inSection) { break }
              $inSection = ($Matches[1] -eq $version)
              continue
            }
            if ($inSection) { $notes += $line }
          }
          $text = ($notes -join "`n").Trim()
          if ($text) {
            Set-Content -Path release-notes.md -Value $text -Encoding utf8
            gh release create '${{ github.ref_name }}' "$env:INSTALLER" "$env:INSTALLER.sha256" `
              --title "BerthMenu ${{ github.ref_name }}" --notes-file release-notes.md
          } else {
            gh release create '${{ github.ref_name }}' "$env:INSTALLER" "$env:INSTALLER.sha256" `
              --title "BerthMenu ${{ github.ref_name }}" --generate-notes
          }
